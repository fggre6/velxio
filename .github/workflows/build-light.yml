name: Build Velxio Windows Desktop

# Offline Windows x64 installer: Tauri 2 + NSIS + embedded WebView2 offline
# installer, with a PyInstaller onedir backend and a bundled WASI-SDK.
# No Docker, no WSL, no Linux runners.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v3.0.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-22/wasi-sdk-22.0.m-mingw64.tar.gz
  WASI_SDK_SHA256: 723f2c4d00b37cb3d1039c080184c58e8bad71aa6dd1a700ead88a07e0f1f446
  # SDCC ships only an NSIS setup.exe for win64 (no zip). Download it from a
  # SourceForge mirror, verify SHA256, then extract the payload with 7-Zip
  # instead of executing the installer (no elevation, no silent-switch guess).
  SDCC_URL: https://master.dl.sourceforge.net/project/sdcc/sdcc-win64/4.6.0/sdcc-4.6.0-x64-setup.exe?viasf=1
  SDCC_SHA256: 0a165e155a052fcf7c29ea703ee77d5a8eb578eba58279e79e885618dc4b2e1a
  SDCC_SIZE: "9949266"
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (desktop mode)
        working-directory: frontend
        run: |
          npm ci
          npm run build:desktop

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build backend (PyInstaller onedir)
        run: |
          pyinstaller --noconfirm --clean --distpath backend/dist --workpath backend/build backend/velxio-backend.spec
          if (-not (Test-Path backend/dist/velxio-backend/velxio-backend.exe)) {
            throw "PyInstaller did not produce velxio-backend.exe"
          }
        shell: pwsh

      - name: Stage backend into Tauri resources
        shell: pwsh
        run: |
          $dst = "frontend/src-tauri/resources/backend"
          Get-ChildItem $dst -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "backend/dist/velxio-backend/*" $dst -Recurse -Force
          if (-not (Test-Path "$dst/velxio-backend.exe")) {
            throw "backend resources staging failed"
          }

      - name: Download and verify WASI-SDK 22 (Windows x64)
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wasi-sdk-22.0.m-mingw64.tar.gz"
          Invoke-WebRequest -Uri $env:WASI_SDK_URL -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          Write-Host "WASI-SDK SHA256: $actual"
          if ($actual -ne $env:WASI_SDK_SHA256) {
            throw "WASI-SDK checksum mismatch: $actual"
          }
          $extract = Join-Path $env:RUNNER_TEMP "wasi-sdk"
          New-Item -ItemType Directory -Force $extract | Out-Null
          tar -xzf $archive -C $extract
          $root = Get-ChildItem $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "WASI-SDK archive has no root directory" }
          $dst = "frontend/src-tauri/resources/wasi-sdk"
          Get-ChildItem $dst -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $root.FullName "*") $dst -Recurse -Force
          if (-not (Test-Path "$dst/bin/clang.exe")) {
            throw "WASI-SDK layout invalid: bin/clang.exe missing"
          }
          if (-not (Test-Path "$dst/share/wasi-sysroot")) {
            throw "WASI-SDK layout invalid: share/wasi-sysroot missing"
          }

      - name: Bundle SDCC (Windows x64)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "sdcc-setup.exe"
          $mirrors = @(
            $env:SDCC_URL,
            "https://cytranet.dl.sourceforge.net/project/sdcc/sdcc-win64/4.6.0/sdcc-4.6.0-x64-setup.exe?viasf=1",
            "https://phoenixnap.dl.sourceforge.net/project/sdcc/sdcc-win64/4.6.0/sdcc-4.6.0-x64-setup.exe?viasf=1",
            "https://netix.dl.sourceforge.net/project/sdcc/sdcc-win64/4.6.0/sdcc-4.6.0-x64-setup.exe?viasf=1",
            "https://gigenet.dl.sourceforge.net/project/sdcc/sdcc-win64/4.6.0/sdcc-4.6.0-x64-setup.exe?viasf=1"
          )
          $ok = $false
          for ($attempt = 1; $attempt -le 3 -and -not $ok; $attempt++) {
            foreach ($url in $mirrors) {
              if (-not $url) { continue }
              try {
                Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 300
                $len = (Get-Item $installer).Length
                $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
                if ($len -eq [int]$env:SDCC_SIZE -and $hash -eq $env:SDCC_SHA256) {
                  Write-Host "SDCC verified: $len bytes, sha256=$hash"
                  $ok = $true
                  break
                }
                Write-Host "Rejected $url (size=$len, sha256=$hash)"
              } catch {
                Write-Host "Download failed from $url : $($_.Exception.Message)"
              }
            }
            if (-not $ok) { Start-Sleep -Seconds 10 }
          }
          if (-not $ok) { throw "Could not download a valid SDCC 4.6.0 installer" }

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            $sevenZip = (Get-Command 7z -ErrorAction Stop).Source
          }
          $dst = "frontend/src-tauri/resources/sdcc"
          Get-ChildItem $dst -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          & $sevenZip x $installer "-o$dst" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed: $LASTEXITCODE" }
          Remove-Item (Join-Path $dst "doc") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $dst '$PLUGINSDIR') -Recurse -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "$dst/bin/sdcc.exe")) {
            throw "SDCC staging failed: bin/sdcc.exe missing"
          }

      - name: Build Tauri app + NSIS installer
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build

      - name: Package installer and checksums
        id: package
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TAG) { throw "RELEASE_TAG is empty" }
          $setup = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "Velxio_$($env:RELEASE_TAG)_x64-setup.exe"
          $out = Join-Path "dist" $name
          Copy-Item $setup.FullName $out -Force
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          "setup=$out" >> $env:GITHUB_OUTPUT
          "sums=dist/SHA256SUMS.txt" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Velxio ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.setup }}
            ${{ steps.package.outputs.sums }}
